<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="گوستیلکانێ">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="manifest" href="manifest.json">

    <title>یارییا گوستیلکانێ - ڤێرژنا زێڕین</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="game-board" id="board">
        <h1>💍 یارییا گوستیلکانێ 💍</h1>

        <div class="scoreboard">
            <div class="team-card" id="team1-card">
                <div class="team-header">
                    <span class="team-emoji" id="emoji1" onclick="cycleEmoji(1)">🦁</span>
                    <input type="text" class="team-name" id="name1" value="گروپێ ١" oninput="saveData()">
                </div>
                <div class="score-container">
                    <span class="score-display" id="score1">0</span>
                </div>
                <div class="role-indicator">نۆڕەیا لێگەڕیانێ یە</div>
                <div class="hiding-badge">💍 گوستیلک یا لڤێرە</div>
            </div>

            <div class="team-card hiding" id="team2-card">
                <div class="team-header">
                    <span class="team-emoji" id="emoji2" onclick="cycleEmoji(2)">🦅</span>
                    <input type="text" class="team-name" id="name2" value="گروپێ ٢" oninput="saveData()">
                </div>
                <div class="score-container">
                    <span class="score-display" id="score2">0</span>
                </div>
                <div class="role-indicator">نۆڕەیا لێگەڕیانێ یە</div>
                <div class="hiding-badge">💍 گوستیلک یا لڤێرە</div>
            </div>
        </div>

        <div id="message">ئامادەکرنا یاریێ...</div>

        <div class="action-bar" id="setup-bar" style="display: none;">
            <div class="settings-box">
                <select id="hand-count-select" onchange="changeHandCount()">
                    <option value="2">2 دەست</option>
                    <option value="4">4 دەست</option>
                    <option value="6">6 دەست</option>
                    <option value="8">8 دەست</option>
                    <option value="10" selected>10 دەست</option>
                    <option value="12">12 دەست</option>
                    <option value="14">14 دەست</option>
                    <option value="16">16 دەست</option>
                    <option value="18">18 دەست</option>
                    <option value="20">20 دەست</option>
                </select>
            </div>
            <button class="start-btn" onclick="beginRound()">دەستپێبکە 🚀</button>
        </div>
        
        <div class="action-bar" id="game-controls" style="display: none;">
            <div class="controls">
                <button id="btn-pichke" class="mode-btn active" onclick="setMode('pichke')">پوچکە (ڤالایە)</button>
                <button id="btn-bine" class="mode-btn" onclick="setMode('bine')">بینە (گوستیلک)</button>
            </div>
        </div>

        <div class="hands-grid" id="hands-container"></div>

        <button id="restart-btn" onclick="continueGame()">دەستەکێ نوی 🔄</button>
    </div>

    <div class="history-box">
        <h3 class="history-title">📜 تۆمارا یاریێ</h3>
        <div class="history-list" id="history-log">
            </div>
        <button class="reset-storage-btn" onclick="hardReset()">ژێبرنا یاریێ و دەستپێکرن ژ سفرێ</button>
    </div>

    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker تۆمار بوو', reg))
                    .catch(err => console.log('تۆمارکرنا SW خەلەت بوو:', err));
            });
        }
    </script>
</body>
</html>
